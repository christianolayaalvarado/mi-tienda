<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="40%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E06000"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CC5500"/>
      <stop offset="100%" stop-color="#993300"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CC3300"/>
      <stop offset="100%" stop-color="#992200"/>
    </linearGradient>
  </defs>

  <g transform="translate(100,110) rotate(-30) translate(-100,-110)">
    <!-- Body outer (edge) -->
    <path d="M60,130 C30,130 15,110 15,85 C15,60 30,45 50,42 C55,30 70,22 90,22 C115,22 130,35 135,55 C155,58 175,70 175,95 C175,125 155,145 125,150 C115,155 95,155 80,150 Z"
      fill="url(#bodyEdge)" stroke="#222" stroke-width="4" stroke-linejoin="round"/>

    <!-- Body inner -->
    <path d="M62,128 C35,128 22,110 22,87 C22,65 35,50 52,47 C57,35 72,28 90,28 C112,28 126,40 130,57 C148,60 168,72 168,95 C168,122 150,140 122,144 C112,148 95,148 82,144 Z"
      fill="url(#bodyGrad)" stroke="none"/>

    <!-- Sound hole ring outer -->
    <circle cx="95" cy="100" r="22" fill="none" stroke="#CC3300" stroke-width="4"/>
    <!-- Sound hole ring inner -->
    <circle cx="95" cy="100" r="18" fill="none" stroke="#CC3300" stroke-width="1.5"/>
    <!-- Sound hole -->
    <circle cx="95" cy="100" r="14" fill="#1a0a00"/>

    <!-- Bridge -->
    <rect x="78" y="125" width="34" height="6" rx="2" fill="#333" stroke="#222" stroke-width="1.5"/>
    <rect x="90" y="123" width="10" height="3" rx="1" fill="#555"/>

    <!-- Strings on body -->
    <line x1="88" y1="48" x2="88" y2="128" stroke="#C0A060" stroke-width="0.8" opacity="0.7"/>
    <line x1="93" y1="46" x2="93" y2="128" stroke="#C0A060" stroke-width="0.8" opacity="0.7"/>
    <line x1="98" y1="46" x2="98" y2="128" stroke="#C0A060" stroke-width="0.8" opacity="0.7"/>
    <line x1="103" y1="48" x2="103" y2="128" stroke="#C0A060" stroke-width="0.8" opacity="0.7"/>

    <!-- Neck -->
    <rect x="87" y="10" width="16" height="40" rx="2" fill="url(#neckGrad)" stroke="#222" stroke-width="3"/>

    <!-- Frets -->
    <line x1="87" y1="18" x2="103" y2="18" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="87" y1="26" x2="103" y2="26" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="87" y1="34" x2="103" y2="34" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="87" y1="42" x2="103" y2="42" stroke="#D4AF37" stroke-width="1.5"/>

    <!-- Headstock -->
    <path d="M82,12 L82,0 C82,-4 86,-6 95,-6 C104,-6 108,-4 108,0 L108,12 Z"
      fill="url(#headGrad)" stroke="#222" stroke-width="3"/>

    <!-- Tuning pegs left -->
    <circle cx="80" cy="2" r="4" fill="#FFD700" stroke="#222" stroke-width="1.5"/>
    <circle cx="80" cy="10" r="4" fill="#FFD700" stroke="#222" stroke-width="1.5"/>

    <!-- Tuning pegs right -->
    <circle cx="110" cy="2" r="4" fill="#FFD700" stroke="#222" stroke-width="1.5"/>
    <circle cx="110" cy="10" r="4" fill="#FFD700" stroke="#222" stroke-width="1.5"/>

    <!-- Nut -->
    <rect x="86" y="10" width="18" height="3" rx="1" fill="#FFF8DC" stroke="#222" stroke-width="1"/>
  </g>
</svg>
