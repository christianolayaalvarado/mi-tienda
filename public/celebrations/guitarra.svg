<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="guitarBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D2691E"/>
      <stop offset="50%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#5C3317"/>
    </linearGradient>
    <linearGradient id="guitarNeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
  </defs>
  <!-- Neck -->
  <rect x="46" y="5" width="8" height="45" rx="2" fill="url(#guitarNeck)"/>
  <!-- Frets -->
  <line x1="46" y1="15" x2="54" y2="15" stroke="#C0A060" stroke-width="1"/>
  <line x1="46" y1="25" x2="54" y2="25" stroke="#C0A060" stroke-width="1"/>
  <line x1="46" y1="35" x2="54" y2="35" stroke="#C0A060" stroke-width="1"/>
  <!-- Headstock -->
  <ellipse cx="50" cy="5" rx="6" ry="4" fill="#3E2723"/>
  <circle cx="47" cy="4" r="1.5" fill="#C0A060"/>
  <circle cx="53" cy="4" r="1.5" fill="#C0A060"/>
  <!-- Body -->
  <ellipse cx="50" cy="65" rx="28" ry="25" fill="url(#guitarBody)" stroke="#3E2723" stroke-width="2"/>
  <ellipse cx="50" cy="72" rx="18" ry="16" fill="#5C3317" opacity="0.3"/>
  <!-- Sound hole -->
  <circle cx="50" cy="62" r="9" fill="#1a0a00" stroke="#C0A060" stroke-width="1.5"/>
  <circle cx="50" cy="62" r="7" fill="none" stroke="#C0A060" stroke-width="0.5" opacity="0.5"/>
  <!-- Strings -->
  <line x1="48" y1="8" x2="48" y2="85" stroke="#C0A060" stroke-width="0.5" opacity="0.8"/>
  <line x1="50" y1="8" x2="50" y2="85" stroke="#C0A060" stroke-width="0.5" opacity="0.8"/>
  <line x1="52" y1="8" x2="52" y2="85" stroke="#C0A060" stroke-width="0.5" opacity="0.8"/>
  <!-- Bridge -->
  <rect x="44" y="80" width="12" height="3" rx="1" fill="#3E2723"/>
  <!-- Decorative rosette -->
  <circle cx="50" cy="62" r="10" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2,2"/>
</svg>
