<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="starGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="starRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#c41e3a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glow circle -->
  <circle cx="50" cy="50" r="35" fill="#FFD700" opacity="0.15"/>
  <circle cx="50" cy="50" r="28" fill="#FFD700" opacity="0.1"/>
  <!-- Star -->
  <polygon
    points="50,5 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38"
    fill="url(#starGold)"
    stroke="#FF8F00"
    stroke-width="1.5"
    filter="url(#glow)"
  />
  <!-- Inner star -->
  <polygon
    points="50,18 57,38 78,38 61,52 68,74 50,62 32,74 39,52 22,38 43,38"
    fill="none"
    stroke="#FFF8DC"
    stroke-width="0.8"
    opacity="0.6"
  />
  <!-- Center circle -->
  <circle cx="50" cy="48" r="5" fill="#c41e3a" stroke="#FFD700" stroke-width="1"/>
  <circle cx="50" cy="48" r="2.5" fill="#FFD700"/>
  <!-- Small decorations -->
  <circle cx="50" cy="5" r="2" fill="#FF1744"/>
  <circle cx="95" cy="38" r="2" fill="#1a5f2a"/>
  <circle cx="5" cy="38" r="2" fill="#c41e3a"/>
  <circle cx="78" cy="92" r="2" fill="#FFD700"/>
  <circle cx="22" cy="92" r="2" fill="#1a5f2a"/>
</svg>
